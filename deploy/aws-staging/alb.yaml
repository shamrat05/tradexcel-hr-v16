AWSTemplateFormatVersion: '2010-09-09'
Description: Optional HTTP ALB for Workforce Suite staging; one EC2 target, no database resources.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetA:
    Type: AWS::EC2::Subnet::Id
  PublicSubnetB:
    Type: AWS::EC2::Subnet::Id
  InstanceId:
    Type: AWS::EC2::Instance::Id
  InstanceSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  BackendPort:
    Type: Number
    Default: 8080
Resources:
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Workforce staging ALB HTTP ingress
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: workforce-staging-alb
  InstanceFromLoadBalancer:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref InstanceSecurityGroupId
      IpProtocol: tcp
      FromPort: !Ref BackendPort
      ToPort: !Ref BackendPort
      SourceSecurityGroupId: !GetAtt LoadBalancerSecurityGroup.GroupId
      Description: Allow ALB to reach the Frappe reverse proxy
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: !Ref BackendPort
      Protocol: HTTP
      TargetType: instance
      VpcId: !Ref VpcId
      Targets:
        - Id: !Ref InstanceId
          Port: !Ref BackendPort
      HealthCheckEnabled: true
      HealthCheckPath: /api/method/frappe.ping
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '15'
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !GetAtt LoadBalancerSecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: workforce-staging-alb
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
Outputs:
  LoadBalancerDNS:
    Value: !GetAtt LoadBalancer.DNSName
  TargetHealthPath:
    Value: /api/method/frappe.ping

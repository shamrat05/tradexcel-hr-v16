[project]
name = "tradex_hr"
authors = [{name = "Tradexcel"}]
description = "Tradexcel HRMS integration"
requires-python = ">=3.10"
dynamic = ["version"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
hrms = ">=15.0.0,<16.0.0"

[project.optional-dependencies]
# PyYAML reads tradex_hr/tradexcel_hr/salary_setup.yaml. It ships with Frappe,
# so this is documentation rather than a new install.
salary-config = ["PyYAML>=6.0"]

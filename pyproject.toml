[project]
name = "workforce_suite"
authors = [{name = "Workforce"}]
description = "Reusable HRMS workflows and controls for Frappe v16"
requires-python = ">=3.14,<3.15"
dependencies = ["python-docx>=1.2,<2"]
dynamic = ["version"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
hrms = ">=16.0.0,<17.0.0"

[project.optional-dependencies]
# PyYAML reads workforce_suite/workforce_suite/salary_setup.yaml. It ships with Frappe,
# so this is documentation rather than a new install.
salary-config = ["PyYAML>=6.0"]
# Optional because most terminal-only sites do not need local biometric
# matching. Install this extra before enabling Workforce Face Match Settings.
face-match = ["opencv-contrib-python-headless>=4.9,<5"]

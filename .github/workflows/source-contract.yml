name: Source contract
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-pure-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
      - run: python -m pip install pytest==8.4.2
      - run: python scripts/check_source.py
      - run: python -m compileall -q workforce_suite
      - name: Pure tests (not Frappe integration)
        run: python -m pytest workforce_suite/tests/test_field_attendance.py workforce_suite/tests/test_no_destructive_scripts_in_package.py -q
      - run: git diff --check

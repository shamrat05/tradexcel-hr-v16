name: White-label QA
on:
  push:
    branches: [refactor/workforce-suite-white-label]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
      - run: python -m pip install pytest==8.4.2 PyYAML==6.0.2
      - name: Compile all application and migration Python
        run: python -m compileall -q workforce_suite scripts
      - name: Parse JSON, TOML and YAML
        run: |
          python - <<'PY'
          import json, pathlib, tomllib, yaml
          root = pathlib.Path(".")
          counts = {}
          for ext, loader in (
              (".json", json.loads),
              (".toml", tomllib.loads),
              (".yaml", yaml.safe_load),
              (".yml", yaml.safe_load),
          ):
              files = [p for p in root.rglob("*" + ext) if ".git" not in p.parts and ".venv" not in p.parts]
              for p in files:
                  loader(p.read_text(encoding="utf-8"))
              counts[ext] = len(files)
          print("Structured files validated:", counts)
          PY
      - name: Validate JavaScript and CommonJS syntax
        run: |
          find workforce_suite -type f \( -name '*.js' -o -name '*.cjs' \) -print0 |
            while IFS= read -r -d '' script; do node --check "$script" || exit 1; done
      - name: Verify native action layout, role gating and callbacks
        run: node scripts/check_native_action_layout.cjs
      - name: Validate renamed Frappe wiring
        run: python scripts/check_white_label_wiring.py
      - name: No legacy customer identifiers and consistent metadata
        run: |
          python -m pytest workforce_suite/tests/test_workforce_identifiers.py workforce_suite/tests/test_white_label_migration_tools.py -q
          python scripts/genericize_to_workforce_suite.py --check
      - name: Source contract
        run: python scripts/check_source.py
      - name: Git whitespace
        run: git diff --check

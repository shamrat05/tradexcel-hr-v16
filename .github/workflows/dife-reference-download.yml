name: DIFE source PDF collection

on:
  push:
    branches: [feat/bd-statutory-form-catalog]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-references:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install PDF verifier
        run: python -m pip install pypdf==5.9.0
      - name: Validate complete DIFE catalog
        run: python scripts/download_dife_reference_forms.py --check
      - name: Fetch and verify PDF originals
        id: fetch
        continue-on-error: true
        run: |
          python scripts/download_dife_reference_forms.py --download \
            --output dife_references --timeout 22 --retries 1 --workers 2
      - name: Upload temporary official reference PDFs and audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dife-source-pdfs-and-download-receipt
          path: dife_references/
          if-no-files-found: warn
          retention-days: 14
      - name: Require complete retrieval
        if: always()
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
        run: |
          test "$FETCH_OUTCOME" = "success" || {
            echo "One or more DIFE PDFs were unavailable; see the uploaded receipt."
            exit 1
          }

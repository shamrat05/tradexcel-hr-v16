name: Bangladesh statutory print QA
on:
  push:
    branches: [feat/bd-statutory-printing-v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  a4-draft-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install render/test dependencies
        run: |
          python -m pip install pytest==8.4.2 weasyprint==66.0 pymupdf==1.26.7
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
      - name: Run source/renderer/permission contracts
        run: python -m pytest workforce_suite/tests/test_statutory_printing.py -q
      - name: Render synthetic multi-page A4 portrait and landscape PDFs
        run: python scripts/check_statutory_a4.py
      - name: Upload A4 render review PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statutory-a4-synthetic-print-reviews
          path: build/statutory_pdf_qa/*.pdf
          retention-days: 14
          if-no-files-found: warn
